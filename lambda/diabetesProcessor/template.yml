AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Diabetes Savings Processor Lambda Function'

Parameters:
  DbHost:
    Type: String
    Description: Database host
  DbPort:
    Type: String
    Default: '5432'
    Description: Database port
  DbName:
    Type: String
    Description: Database name
  DbUser:
    Type: String
    Description: Database user
  DbPassword:
    Type: String
    NoEcho: true
    Description: Database password
  DbSchema:
    Type: String
    Default: 'edpm'
    Description: Database schema

Resources:
  DiabetesProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.handler
      Runtime: nodejs14.x
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SCHEMA: !Ref DbSchema
      Policies:
        - AWSLambdaBasicExecutionRole

Outputs:
  DiabetesProcessorFunction:
    Description: "Diabetes Processor Lambda Function ARN"
    Value: !GetAtt DiabetesProcessorFunction.Arn