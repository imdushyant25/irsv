AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Weight Loss Savings Processor Lambda function

Resources:
  WeightLossSavingsProcessor:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      CodeUri: ./dist/
      Description: 'Lambda function to calculate weight loss medication savings'
      MemorySize: 1024
      Timeout: 300
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - rds:*
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: '*'
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          DB_SCHEMA: !Ref DBSchema

Parameters:
  DBHost:
    Type: String
    Description: Database host
    Default: ''
  DBPort:
    Type: String
    Description: Database port
    Default: '5432'
  DBName:
    Type: String
    Description: Database name
    Default: ''
  DBUser:
    Type: String
    Description: Database user
    Default: ''
  DBPassword:
    Type: String
    Description: Database password
    Default: ''
  DBSchema:
    Type: String
    Description: Database schema
    Default: 'edpm'

Outputs:
  WeightLossSavingsProcessorArn:
    Description: "Weight Loss Savings Processor Lambda ARN"
    Value: !GetAtt WeightLossSavingsProcessor.Arn
  WeightLossSavingsProcessorFunction:
    Description: "Weight Loss Savings Processor Lambda Function"
    Value: !Ref WeightLossSavingsProcessor